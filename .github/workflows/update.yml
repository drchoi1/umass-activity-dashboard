name: Update UMass Activity Dashboard
on:
  schedule:
    - cron: "9 0 * * *"
    - cron: "9 1 * * *"
    - cron: "9 12 * * *"
    - cron: "9 13 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check Eastern hour
        id: timecheck
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo
          import os
          n=datetime.now(ZoneInfo("America/New_York")); run=n.hour in (8,20)
          print("Eastern:",n.isoformat(),"run:",run)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("run="+("yes" if run else "no")+"\n")
          PY
      - uses: actions/setup-python@v6
        if: steps.timecheck.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        if: steps.timecheck.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Build dashboard
        if: steps.timecheck.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: python update_dashboard.py
      - name: Commit generated page
        if: steps.timecheck.outputs.run == 'yes' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "umass-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html data/
          git diff --cached --quiet && exit 0
          git commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
